name: Build Windows executable

# PyInstaller does not cross-compile: a Windows .exe has to be produced on
# Windows. This runs on every push to a build branch, and on demand from the
# Actions tab, and leaves SEMSimulator.exe as a downloadable artifact.

on:
  push:
    branches: ["claude/**", "main", "master"]
    paths-ignore: ["**.md", "docs/**"]
  workflow_dispatch:
    inputs:
      run_tests:
        description: "Run the full test suite before building"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # 3.12 rather than the newest: every dependency here, pyreadstat
          # included, ships prebuilt Windows wheels for it, so the runner
          # never has to compile anything.
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pytest

      - name: Run the test suite
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.run_tests }}
        run: python -m pytest tests -q
        timeout-minutes: 30

      - name: Build the executable
        run: pyinstaller packaging/semsim.spec --noconfirm --clean

      - name: Verify the bundle actually works
        # A packaged build can open its window, show its menus and list its
        # examples while being quietly broken, because PyInstaller's static
        # analysis misses the scipy submodules imported lazily. --self-test
        # compiles a model, generates data, estimates it and computes the fit
        # indices, so a bundle that would die the moment a researcher pressed
        # Run fails here instead of in their hands.
        #
        # Start-Process -Wait, not a bare call. The spec sets console=False so
        # the .exe is a GUI-subsystem binary: PowerShell launches one and
        # returns IMMEDIATELY without waiting, and its stdout is not attached
        # to the runner's console. A bare `.\dist\SEMSimulator.exe --self-test`
        # therefore printed nothing, never blocked, and left $LASTEXITCODE
        # belonging to some earlier command -- so the step passed green while
        # verifying nothing at all. Redirecting to a file gives the process a
        # real handle to write to, and -Wait plus -PassThru gives us its true
        # exit code.
        run: |
          function Invoke-Bundle([string[]] $arguments, [string] $label) {
            $out = "$env:RUNNER_TEMP\$label.out.txt"
            $err = "$env:RUNNER_TEMP\$label.err.txt"
            $proc = Start-Process -FilePath ".\dist\SEMSimulator.exe" `
              -ArgumentList $arguments -Wait -PassThru -NoNewWindow `
              -RedirectStandardOutput $out -RedirectStandardError $err
            Get-Content $out -ErrorAction SilentlyContinue | Write-Host
            $stderr = Get-Content $err -Raw -ErrorAction SilentlyContinue
            if ($stderr) { Write-Host "stderr:`n$stderr" }
            if ($proc.ExitCode -ne 0) {
              throw "$label exited with $($proc.ExitCode)"
            }
          }
          Invoke-Bundle @("--list-examples") "list"
          Invoke-Bundle @("--self-test") "selftest"
        shell: pwsh

      - name: Report the size
        run: |
          $f = Get-Item .\dist\SEMSimulator.exe
          "SEMSimulator.exe  {0:N1} MB" -f ($f.Length / 1MB)
          "SHA256 {0}" -f (Get-FileHash $f.FullName -Algorithm SHA256).Hash
        shell: pwsh

      - uses: actions/upload-artifact@v4
        with:
          name: SEMSimulator-windows-x64
          path: dist/SEMSimulator.exe
          if-no-files-found: error
          retention-days: 30
          compression-level: 9
