[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "semsim"
version = "1.2.0"
description = "SEM Data Simulation Engine - a virtual laboratory for structural equation modelling data"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Mohamed Ali" }]
keywords = [
    "structural equation modeling", "SEM", "monte carlo", "simulation",
    "psychometrics", "social science research methods", "power analysis",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Natural Language :: Arabic",
    "Natural Language :: English",
]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.1",
    "PySide6>=6.6",
    "matplotlib>=3.8",
    "openpyxl>=3.1",
    "pyreadstat>=1.2",
    "Jinja2>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "pytest-cov>=4.1"]
build = ["pyinstaller>=6.3"]

[project.scripts]
semsim = "semsim.__main__:main"

[project.gui-scripts]
semsim-gui = "semsim.__main__:main"

[tool.setuptools.packages.find]
include = ["semsim*"]

[tool.setuptools.package-data]
semsim = ["resources/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = ["error::RuntimeWarning"]

[tool.ruff]
line-length = 88
target-version = "py311"
